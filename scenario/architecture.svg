<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="t d"><title id="t">Wardlight learning architecture</title><desc id="d">Twelve learning components move from access guardrails to telemetry, detection, response, investigation and hunting. Live integrations require separate setup and licenses.</desc><rect width="1100" height="620" fill="#f3f6fa"/><text x="40" y="50" fill="#17304a" font-family="sans-serif" font-size="28">Wardlight security operations learning architecture</text><g><rect x="40" y="85" width="320" height="95" rx="8" fill="white" stroke="#93b7c0"/><text x="57" y="115" fill="#006b70" font-family="sans-serif" font-size="17">01 / SOC foundations</text><text x="57" y="148" fill="#17304a" font-family="sans-serif" font-size="15">Days 1</text></g><g><rect x="390" y="85" width="320" height="95" rx="8" fill="white" stroke="#93b7c0"/><text x="407" y="115" fill="#006b70" font-family="sans-serif" font-size="17">02 / Sentinel platform</text><text x="407" y="148" fill="#17304a" font-family="sans-serif" font-size="15">Days 2</text></g><g><rect x="740" y="85" width="320" height="95" rx="8" fill="white" stroke="#93b7c0"/><text x="757" y="115" fill="#006b70" font-family="sans-serif" font-size="17">03 / Telemetry engineering</text><text x="757" y="148" fill="#17304a" font-family="sans-serif" font-size="15">Days 3, 4</text></g><g><rect x="40" y="210" width="320" height="95" rx="8" fill="white" stroke="#93b7c0"/><text x="57" y="240" fill="#006b70" font-family="sans-serif" font-size="17">04 / Endpoint protection</text><text x="57" y="273" fill="#17304a" font-family="sans-serif" font-size="15">Days 5, 6</text></g><g><rect x="390" y="210" width="320" height="95" rx="8" fill="white" stroke="#93b7c0"/><text x="407" y="240" fill="#006b70" font-family="sans-serif" font-size="17">05 / Detection engineering</text><text x="407" y="273" fill="#17304a" font-family="sans-serif" font-size="15">Days 7</text></g><g><rect x="740" y="210" width="320" height="95" rx="8" fill="white" stroke="#93b7c0"/><text x="757" y="240" fill="#006b70" font-family="sans-serif" font-size="17">06 / Response automation</text><text x="757" y="273" fill="#17304a" font-family="sans-serif" font-size="15">Days 8</text></g><g><rect x="40" y="335" width="320" height="95" rx="8" fill="white" stroke="#93b7c0"/><text x="57" y="365" fill="#006b70" font-family="sans-serif" font-size="17">07 / Email defence</text><text x="57" y="398" fill="#17304a" font-family="sans-serif" font-size="15">Days 9</text></g><g><rect x="390" y="335" width="320" height="95" rx="8" fill="white" stroke="#93b7c0"/><text x="407" y="365" fill="#006b70" font-family="sans-serif" font-size="17">08 / Identity and SaaS</text><text x="407" y="398" fill="#17304a" font-family="sans-serif" font-size="15">Days 10</text></g><g><rect x="740" y="335" width="320" height="95" rx="8" fill="white" stroke="#93b7c0"/><text x="757" y="365" fill="#006b70" font-family="sans-serif" font-size="17">09 / Data investigations</text><text x="757" y="398" fill="#17304a" font-family="sans-serif" font-size="15">Days 11</text></g><g><rect x="40" y="460" width="320" height="95" rx="8" fill="white" stroke="#93b7c0"/><text x="57" y="490" fill="#006b70" font-family="sans-serif" font-size="17">10 / Cloud workload defence</text><text x="57" y="523" fill="#17304a" font-family="sans-serif" font-size="15">Days 12</text></g><g><rect x="390" y="460" width="320" height="95" rx="8" fill="white" stroke="#93b7c0"/><text x="407" y="490" fill="#006b70" font-family="sans-serif" font-size="17">11 / Cases and operations</text><text x="407" y="523" fill="#17304a" font-family="sans-serif" font-size="15">Days 13, 14</text></g><g><rect x="740" y="460" width="320" height="95" rx="8" fill="white" stroke="#93b7c0"/><text x="757" y="490" fill="#006b70" font-family="sans-serif" font-size="17">12 / Hunting and capstone</text><text x="757" y="523" fill="#17304a" font-family="sans-serif" font-size="15">Days 15, 16, 17, 18</text></g><text x="40" y="606" font-family="sans-serif" font-size="14" fill="#52677b">Numbered teaching sequence; not a claim that every service is connected by deployment.</text></svg>
